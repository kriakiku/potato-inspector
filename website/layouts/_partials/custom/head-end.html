<script>
  (function () {
    var REPO = "kriakiku/potato-network";
    var HREF = "https://github.com/" + REPO;
    var API = "https://api.github.com/repos/" + REPO;
    var CACHE_KEY = "pn-gh-stars";
    var CACHE_MS = 30 * 60 * 1000;
    var GH_SVG =
      '<svg class="pn-github-star__logo" height="16" width="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">' +
      '<path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38' +
      " 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52" +
      "-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2" +
      "-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82" +
      ".64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12" +
      ".51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93" +
      '-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>';

    function formatCount(n) {
      if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k";
      return String(n);
    }

    function navLinks() {
      // Only the Hextra navbar — never touch ReDoc / content links.
      return document.querySelectorAll(
        '.hextra-nav-container a[href="' + HREF + '"], .hextra-nav-container a[href="' + HREF + '/"]'
      );
    }

    function apply(count) {
      navLinks().forEach(function (a) {
        a.classList.add("pn-github-star");
        a.title = "Star " + REPO + " on GitHub";
        a.setAttribute("aria-label", "Star " + REPO + " on GitHub");
        var countHtml =
          count != null
            ? '<span class="pn-github-star__count">' + formatCount(count) + "</span>"
            : '<span class="pn-github-star__count pn-github-star__count--pending">…</span>';
        a.innerHTML =
          GH_SVG +
          '<span class="pn-github-star__repo"><span class="pn-github-star__owner">kriakiku</span><span class="pn-github-star__slash">/</span><span class="pn-github-star__name">potato-network</span></span>' +
          '<span class="pn-github-star__stars" aria-hidden="true">' +
          '<span class="pn-github-star__icon">★</span>' +
          countHtml +
          "</span>";
      });
    }

    function load() {
      try {
        var cached = sessionStorage.getItem(CACHE_KEY);
        if (cached) {
          var parsed = JSON.parse(cached);
          if (parsed && Date.now() - parsed.ts < CACHE_MS) {
            apply(parsed.count);
            return;
          }
        }
      } catch (e) {}

      apply(null);
      fetch(API, { headers: { Accept: "application/vnd.github+json" } })
        .then(function (r) {
          if (!r.ok) throw new Error("github api " + r.status);
          return r.json();
        })
        .then(function (data) {
          var count = data.stargazers_count;
          try {
            sessionStorage.setItem(CACHE_KEY, JSON.stringify({ count: count, ts: Date.now() }));
          } catch (e) {}
          apply(count);
        })
        .catch(function () {
          apply(0);
        });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", load);
    } else {
      load();
    }
  })();
</script>
