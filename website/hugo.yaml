baseURL: https://kriakiku.github.io/potato-network/
languageCode: en-us
title: PotatoNetwork 🥔

module:
  imports:
    - path: github.com/imfing/hextra

outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML, RSS]

defaultContentLanguage: en
enableRobotsTXT: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: ""
      weight: 1
      url: https://github.com/kriakiku/potato-network
      params:
        icon: github

params:
  description: Last-mile network emulator for Docker sidecars
  images:
    - images/social-preview.png
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: dark
    displayToggle: false
  search:
    enable: false
  footer:
    displayCopyright: false
    displayPoweredBy: false
  editURL:
    enable: true
    base: https://github.com/kriakiku/potato-network/edit/main/website/content

