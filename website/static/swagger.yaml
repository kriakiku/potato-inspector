basePath: /
definitions:
  api.BaselinePutRequest:
    properties:
      hostRtt:
        additionalProperties:
          type: integer
        type: object
    type: object
  api.BaselineResponse:
    properties:
      hostRtt:
        additionalProperties:
          type: integer
        type: object
      probedAt:
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  api.CatalogRefreshResponse:
    properties:
      generatedAt:
        example: "2026-01-01T00:00:00Z"
        type: string
      ok:
        example: true
        type: boolean
    type: object
  api.ErrorResponse:
    properties:
      error:
        example: unauthorized
        type: string
    type: object
  api.HealthResponse:
    properties:
      ok:
        example: true
        type: boolean
      product:
        example: PotatoNetwork
        type: string
      profile:
        example: passthrough
        type: string
      shape:
        example: passthrough
        type: string
    type: object
  api.ProfilePutRequest:
    properties:
      country:
        example: BD
        type: string
      passthrough:
        example: false
        type: boolean
      tier:
        example: typical
        type: string
    type: object
  api.RulesStatus:
    properties:
      compile:
        type: string
      ok:
        example: true
        type: boolean
      path:
        example: /data/rules.expr
        type: string
      source:
        type: string
    type: object
  catalog.Catalog:
    properties:
      countries:
        items:
          $ref: '#/definitions/catalog.Country'
        type: array
      destinations:
        additionalProperties:
          $ref: '#/definitions/catalog.Destination'
        type: object
      generatedAt:
        type: string
      source:
        type: string
    type: object
  catalog.Country:
    properties:
      id:
        type: string
      name:
        type: string
      nearestAws:
        type: string
      rttSource:
        type: string
      tiers:
        additionalProperties:
          $ref: '#/definitions/catalog.Tier'
        type: object
    type: object
  catalog.Destination:
    properties:
      awsRegion:
        type: string
      calibrate:
        type: string
      label:
        type: string
      target:
        type: string
    type: object
  catalog.Tier:
    properties:
      downloadMbps:
        type: number
      lossPercent:
        type: number
      rttToDest:
        additionalProperties:
          type: integer
        type: object
      uploadMbps:
        type: number
    type: object
  profiles.Profile:
    properties:
      country:
        type: string
      delayMs:
        type: integer
      description:
        type: string
      downloadMbps:
        type: number
      emulationLimited:
        type: boolean
      id:
        type: string
      lossPercent:
        type: number
      name:
        type: string
      passthrough:
        type: boolean
      tier:
        type: string
      uploadMbps:
        type: number
      warning:
        type: string
    type: object
host: localhost:7783
info:
  contact:
    name: PotatoNetwork
    url: https://github.com/kriakiku/potato-network
  description: |-
    Last-mile network emulator control plane for Docker sidecars.
    Optional Bearer auth when POTATONETWORK_API_TOKEN is set.
  license:
    name: See repository LICENSE
    url: https://github.com/kriakiku/potato-network
  title: PotatoNetwork API
  version: "1.0"
paths:
  /:
    get:
      description: 302 to GitHub Pages OpenAPI section
      produces:
      - application/json
      responses:
        "302":
          description: 'Location: docs URL'
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Redirect to docs
      tags:
      - system
  /v1/baseline:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BaselineResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get baseline
      tags:
      - baseline
    put:
      consumes:
      - application/json
      parameters:
      - description: Host RTT map
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.BaselinePutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BaselineResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set baseline
      tags:
      - baseline
  /v1/baseline/probe:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BaselineResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Probe baseline
      tags:
      - baseline
  /v1/ca.pem:
    get:
      produces:
      - application/x-pem-file
      responses:
        "200":
          description: PEM certificate
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download CA certificate
      tags:
      - ca
  /v1/catalog:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.Catalog'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get catalog
      tags:
      - catalog
  /v1/catalog/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.CatalogRefreshResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Refresh catalog
      tags:
      - catalog
  /v1/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HealthResponse'
      summary: Health check
      tags:
      - system
  /v1/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/profiles.Profile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get profile
      tags:
      - profile
    put:
      consumes:
      - application/json
      parameters:
      - description: Country+tier or passthrough
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ProfilePutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/profiles.Profile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set profile
      tags:
      - profile
  /v1/rules:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.RulesStatus'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rules status
      tags:
      - rules
securityDefinitions:
  BearerAuth:
    description: 'Optional. Format: Bearer followed by the API token.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
