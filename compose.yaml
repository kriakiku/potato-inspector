# Single-image wrapper for PotatoInspector.
services:
  potatoinspector:
    image: ghcr.io/kriakiku/potato-inspector:latest
    build: .
    container_name: potatoinspector
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "51820:51820/udp"
      - "8443:8443"
      - "8444:80"
      # Optional host debug for HTTPS Share API (WG clients use potato-share.local:443 inside the tunnel)
      - "8445:443"
    volumes:
      - potatoinspector-data:/data
    # Optional env: POTATOINSPECTOR_WG_SUBNET, POTATOINSPECTOR_PANEL, …
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped

volumes:
  potatoinspector-data:
