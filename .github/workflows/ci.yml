name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go test ./...
      - run: go build -o potatonetwork ./cmd/potatonetwork
      - run: go run -tags gallery ./cmd/gengallery/
      - name: Generate OpenAPI
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.4 init \
            -g main.go \
            -d ./cmd/potatonetwork,./internal/api,./internal/profiles,./internal/catalog \
            -o ./website/static \
            --outputTypes json,yaml \
            --parseDependency --parseInternal
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Build and start PotatoNetwork
        run: docker compose -f compose.e2e.yaml up -d --build
      - name: E2E tests
        env:
          POTATONETWORK_E2E_API: http://127.0.0.1:7783
          POTATONETWORK_E2E_CONTAINER: potatonetwork-e2e
        run: go test -tags e2e -count=1 -timeout 10m -v ./e2e/
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.e2e.yaml logs --no-color || true
      - name: Tear down
        if: always()
        run: docker compose -f compose.e2e.yaml down -v
