name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go test
        run: go test ./...

      - name: Go build (linux)
        run: CGO_ENABLED=0 go build -o /tmp/potatoinspector ./cmd/potatoinspector

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Web build
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: potatoinspector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
