name: Docs

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "internal/catalog/data/catalog.json"
      - "internal/api/**"
      - "internal/profiles/**"
      - "internal/catalog/**"
      - "cmd/gengallery/**"
      - "cmd/genapi/**"
      - "cmd/potatonetwork/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Generate profiles gallery
        run: go run -tags gallery ./cmd/gengallery/
      - name: Generate OpenAPI
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.4 init \
            -g main.go \
            -d ./cmd/potatonetwork,./internal/api,./internal/profiles,./internal/catalog \
            -o ./website/static \
            --outputTypes json,yaml \
            --parseDependency --parseInternal
      - name: Generate API markdown
        run: go run -tags genapi ./cmd/genapi/
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.8"
          extended: true
      - name: Build
        working-directory: website
        run: |
          hugo mod tidy
          hugo --minify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
