name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dependabot squash-merges should move nightly, not latest (keep latest = intentional main tip / release).
      - name: Image channel
        id: channel
        run: |
          set -euo pipefail
          MSG="$(git log -1 --pretty=%B)"
          AUTHOR="$(git log -1 --pretty='%an <%ae>')"
          echo "head_subject=$(git log -1 --pretty=%s)"
          LATEST=true
          CHANNEL=main
          if echo "$MSG$AUTHOR" | grep -qiE 'dependabot|chore\(deps\)|^Bump '; then
            LATEST=false
            CHANNEL=dependabot
          fi
          # Tag pushes always refresh latest + semver.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            LATEST=true
            CHANNEL=release
          fi
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL} latest=${LATEST}"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/potato-network
          labels: |
            org.opencontainers.image.title=PotatoNetwork
            pn.image.channel=${{ steps.channel.outputs.channel }}
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ steps.channel.outputs.latest == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
