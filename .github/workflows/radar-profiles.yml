name: Radar profile catalog

on:
  schedule:
    # :23 avoids the crowded top-of-hour slot used by many public crons
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Generate catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDPING_URL: https://www.cloudping.co/api/latencies
        run: go run -tags radar ./cmd/genradar/

      - name: Profiles gallery
        run: go run -tags gallery ./cmd/gengallery/

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json internal/catalog/data/catalog.json website/content/profiles-gallery.md
          if git diff --staged --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "chore: refresh radar profile catalog (Radar + CloudPing)"
          git push
